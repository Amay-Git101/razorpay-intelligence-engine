<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="'SFMono-Regular','Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <style>
      .lbl { fill: #9aa3b2; font-size: 15px; letter-spacing: 2px; }
      .title { fill: #e6e9ef; font-size: 44px; font-weight: 700; }
      .accent { fill: #5b8cff; }
      .sub { fill: #9aa3b2; font-size: 17px; }
      .stage { fill: #171b24; stroke: #232834; }
      .stage-text { fill: #e6e9ef; font-size: 16px; font-weight: 600; }
      .stage-num { fill: #626b7a; font-size: 12px; }
      .final { fill: rgba(62,207,142,0.12); stroke: #3ecf8e; }
      .final-text { fill: #3ecf8e; }
      .arrow { stroke: #626b7a; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#0b0d12"/>
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#232834" stroke-width="1"/>

  <text x="60" y="90" class="lbl">RAZORPAY BUILDATHON · TEST MODE INTEGRATION</text>
  <text x="60" y="150" class="title">Payments don&#8217;t need to</text>
  <text x="60" y="200" class="title">end at <tspan class="accent">AUTHORIZED</tspan>.</text>
  <text x="60" y="245" class="sub">Observes payment state · evaluates recovery · applies merchant policy ·</text>
  <text x="60" y="270" class="sub">executes authorized actions · independently verifies the outcome.</text>

  <!-- stage pipeline -->
  <g transform="translate(60,340)">
    <!-- connecting line -->
    <line x1="70" y1="40" x2="1010" y2="40" class="arrow"/>

    <g transform="translate(0,0)">
      <rect width="150" height="80" rx="8" class="stage"/>
      <text x="14" y="24" class="stage-num">01</text>
      <text x="14" y="50" class="stage-text">Observe</text>
    </g>
    <g transform="translate(215,0)">
      <rect width="150" height="80" rx="8" class="stage"/>
      <text x="14" y="24" class="stage-num">02</text>
      <text x="14" y="50" class="stage-text">Reason</text>
    </g>
    <g transform="translate(430,0)">
      <rect width="150" height="80" rx="8" class="stage"/>
      <text x="14" y="24" class="stage-num">03</text>
      <text x="14" y="50" class="stage-text">Authorize</text>
    </g>
    <g transform="translate(645,0)">
      <rect width="150" height="80" rx="8" class="stage"/>
      <text x="14" y="24" class="stage-num">04</text>
      <text x="14" y="50" class="stage-text">Act</text>
    </g>
    <g transform="translate(860,0)">
      <rect width="150" height="80" rx="8" class="final"/>
      <text x="14" y="24" class="stage-num">05</text>
      <text x="14" y="50" class="stage-text final-text">Verify</text>
    </g>
  </g>

  <text x="60" y="560" class="sub">RECOMMEND_CAPTURE → ALLOW → CAPTURE_PAYMENT → VERIFIED_SUCCESS</text>
  <text x="60" y="590" class="lbl">Verified against a live Razorpay Test Mode transaction · deterministic RuleBasedEngine (rule_v1)</text>
</svg>
