<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Payment Recovery Lab — an agent that triages a merchant's failed-payment backlog. Razorpay Buildathon, AI Revenue Recovery track.">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#fafafa"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#3395ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#2563eb" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade" cx="0.12" cy="0" r="1.25">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="0.82" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridmask"><rect width="1200" height="630" fill="url(#fade)"/></mask>
  </defs>

  <rect width="1200" height="630" fill="url(#ground)"/>
  <rect width="1200" height="630" fill="url(#grid)" mask="url(#gridmask)"/>

  <!-- Razorpay-style R mark, the same path the site's favicon uses -->
  <g transform="translate(880 250) scale(3.4)" opacity="0.10">
    <path d="M26 68 L26 32 L52 32 Q66 32 66 46 Q66 58 52 58 L38 58 L74 68"
          fill="none" stroke="#2563eb" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(84 96)">
    <g>
      <rect x="0" y="0" width="272" height="30" rx="15" fill="#2563eb" fill-opacity="0.1"/>
      <circle cx="17" cy="15" r="4" fill="#2563eb"/>
      <text x="31" y="20" font-size="13" font-weight="700" letter-spacing="1.4" fill="#2563eb"
            font-family="'Segoe UI',Helvetica,Arial,sans-serif">RAZORPAY TEST MODE · LIVE</text>
    </g>

    <text y="128" font-family="Georgia,'Times New Roman',serif" font-size="82" font-weight="700" fill="#020817">Payment</text>
    <text y="214" font-family="Georgia,'Times New Roman',serif" font-size="82" font-weight="700" fill="#2563eb">Recovery Lab</text>

    <text y="270" font-size="23" fill="#475569" font-family="'Segoe UI',Helvetica,Arial,sans-serif">Razorpay tells a merchant a payment failed.</text>
    <text y="304" font-size="23" fill="#475569" font-family="'Segoe UI',Helvetica,Arial,sans-serif">It doesn't say which failures are worth chasing — or when to stop.</text>
  </g>

  <!-- The pipeline, in the order it actually runs -->
  <g transform="translate(84 468)" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
    <line x1="8" y1="18" x2="900" y2="18" stroke="#cbd5e1" stroke-width="2"/>
    <g fill="#020817" font-size="14" font-weight="600" text-anchor="middle">
      <g><circle cx="8" cy="18" r="8" fill="url(#blue)"/><text x="8" y="52">Detect</text></g>
      <g><circle cx="187" cy="18" r="8" fill="url(#blue)"/><text x="187" y="52">Classify</text></g>
      <g><circle cx="366" cy="18" r="8" fill="url(#blue)"/><text x="366" y="52">Recommend</text></g>
      <g><circle cx="545" cy="18" r="8" fill="url(#blue)"/><text x="545" y="52">Authorize</text></g>
      <g><circle cx="724" cy="18" r="8" fill="url(#blue)"/><text x="724" y="52">Act</text></g>
      <g><circle cx="900" cy="18" r="10" fill="#15803d"/><text x="900" y="52" fill="#15803d">Verify</text></g>
    </g>
    <text x="0" y="86" font-size="14.5" fill="#64748b">Four separate stages. Only one of them may write to Razorpay. Only the last one may declare success.</text>
  </g>

  <text x="1116" y="586" text-anchor="end" font-size="14" fill="#94a3b8" font-family="'Segoe UI',Helvetica,Arial,sans-serif">Razorpay Buildathon · AI Revenue Recovery</text>
</svg>
