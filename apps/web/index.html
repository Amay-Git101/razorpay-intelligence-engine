  <!--
    Razorpay Checkout. This is Razorpay's own script, loaded from Razorpay's
    own domain, and it is the only external resource this page loads. It is
    what makes the payment step real: the evaluator enters Test Mode payment
    details in Razorpay's dialog, not in anything this project wrote.

    It receives the publishable key id, fetched at runtime from
    /checkout-config. The secret never reaches the browser -- there is no
    endpoint that returns it.
  -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
